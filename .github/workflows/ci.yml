name: Lab 2 - FastAPI CI

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - README.md
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and check code
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app tests

      - name: Run unit tests
        run: python -m pytest -q

  docker-pack-n-push:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_repository: 'yunkaaz/fastapi-ci-cd-lab1'
      image_tag: 'latest'
      push_to_hub: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
