name: Reusable - Docker pack and push

on:
  workflow_call:
    inputs:
      image_repository:
        description: 'Docker Hub repository (username/repository)'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      push_to_hub:
        description: 'Publish image to Docker Hub for main branch'
        required: true
        type: boolean
    secrets:
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false

permissions:
  contents: read

jobs:
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: docker build -t "$IMAGE_REPOSITORY:$IMAGE_TAG" .

      - name: Save image for feature and bugfix branches
        if: ${{ github.ref != 'refs/heads/main' || !inputs.push_to_hub }}
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: docker save "$IMAGE_REPOSITORY:$IMAGE_TAG" -o docker-image.tar

      - name: Upload Docker image artifact
        if: ${{ github.ref != 'refs/heads/main' || !inputs.push_to_hub }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 7
          if-no-files-found: error

      - name: Log in to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' && inputs.push_to_hub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push Docker image to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' && inputs.push_to_hub }}
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
